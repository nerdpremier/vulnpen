services:
  mongodb:
    container_name: vulnpen-mongodb
    image: mongo:7
    volumes:
      - mongodb-data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: always

  redis:
    container_name: vulnpen-redis
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: always

  # MongoDB web UI, for looking at what the agent actually stored (sessions,
  # messages, findings) while debugging. It is a *tool*, not part of the app, so
  # it lives behind a profile: a plain `docker compose up -d` never starts it.
  #
  #     docker compose --profile tools up -d mongo-express
  #
  # Basic Auth is off and it binds to loopback only — do not publish it wider,
  # and do not enable the profile on a shared host. `./run.sh stop` tears it
  # down along with the rest of the stack.
  mongo-express:
    container_name: vulnpen-mongo-express
    image: mongo-express:latest
    profiles:
      - tools
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      ME_CONFIG_BASICAUTH: "false"
      ME_CONFIG_SITE_SESSIONSECRET: secret
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  backend:
    container_name: vulnpen-backend
    build: ./backend
    environment:
      MONGO_URI: mongodb://mongodb:27017/vulnpen
      REDIS_URL: redis://redis:6379
      CODEX_HOME: /root/.codex
      SSH_CONFIG_FILE: /root/.ssh/config
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1,mongodb,redis,collabora,host.docker.internal}"
      # Report editor (WOPI/Collabora): COLLABORA_URL is server-side discovery
      # (container network), COLLABORA_PUBLIC_URL is the browser iframe address,
      # WOPI_PUBLIC_BASE is how Collabora calls back into the backend.
      COLLABORA_URL: http://collabora:9980
      COLLABORA_PUBLIC_URL: http://localhost:9980
      WOPI_PUBLIC_BASE: http://host.docker.internal:8080/api/wopi/files
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:6080:6080"
    volumes:
      - backend-data:/srv/data
      - ./backend/.env:/srv/data/.env
      - ./backend/model-registry.json:/srv/data/model-registry.json
      - ./config.toml:/srv/data/config.toml:ro
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      collabora:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/healthcheck').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s


  # LibreOffice in the browser — the report is opened/edited here like Word.
  # COLLABORA_URL (server-side) / COLLABORA_PUBLIC_URL (browser iframe) /
  # WOPI_PUBLIC_BASE (WOPI callback) are set on the backend service above.
  collabora:
    container_name: vulnpen-collabora
    image: collabora/code:latest
    environment:
      - aliasgroup1=http://host.docker.internal:8080.*
      - aliasgroup2=http://backend:8080.*
      - username=admin
      - password=${COLLABORA_PASSWORD:-vulnpen-admin}
      # Every report opens at a literal 100%. Collabora's smart zoom instead
      # fits the page to the frame width, and Writer's zoom scale tops out at
      # 170%, so on a wide window the report always opened over-zoomed at that
      # ceiling and changed size with the window.
      - extra_params=--o:ssl.enable=false --o:ssl.termination=false --o:net.post_allow.host[0]=.+ --o:frame_ancestors=localhost:3000 --o:user_interface.smart_zoom=false --o:user_interface.default_zoom=100
    cap_add:
      - MKNOD
    ports:
      - "127.0.0.1:9980:9980"
    restart: unless-stopped

  frontend:
    container_name: vulnpen-frontend
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_URI: ${NEXT_PUBLIC_BACKEND_URI:-http://localhost:8080}
        NEXT_PUBLIC_DEPLOYMENT: ${NEXT_PUBLIC_DEPLOYMENT:-LOCAL}
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ./frontend/.env
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongodb-data:
    driver: local
  redis-data:
    driver: local
  backend-data:
    driver: local
