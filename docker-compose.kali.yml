# ── Kali / attack-box override ─────────────────────────────
# This file is an *override* of docker-compose.yml, NOT a standalone stack.
# Always pass both files, base first:
#
#     docker compose -f docker-compose.yml -f docker-compose.kali.yml up -d
#
# run.sh does that for you in "Full Docker + Kali" mode. Everything the base
# file already defines (mongodb, redis, collabora, frontend, and the backend's
# image, base volumes, healthcheck and Collabora wiring) is inherited; only
# what the attack box *changes* is listed below.
services:
  backend:
    networks:
      # `default` is how the backend reaches Mongo, Redis, the outside world and
      # the attack box; `control` is an internal network it shares with the box.
      - default
      - control
    environment:
      # The attack box as the *backend* reaches it: the Compose service name on
      # the control network, not the host's published 127.0.0.1:4242 — that
      # address is loopback on the host and there is nothing behind it inside
      # this container. Without these two, `buildSSHConfig()` falls through to
      # the mounted .env, which carries the host-facing values, and every
      # SSH-dependent feature fails with ECONNREFUSED 127.0.0.1:4242: launching
      # the browser agent on the attack box, running agent commands there, and
      # provisioning the desktop. docker-compose.dev.yml sets the same pair.
      SSH_HOST: kali
      SSH_PORT: "22"
      WORKSPACE_DIR: /kali-data/workspaces
      # Same as the base value plus `kali`: requests the backend makes to the
      # attack box must not be sent through an HTTP proxy.
      NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1,mongodb,redis,kali,collabora,host.docker.internal}"
      # The browser agent's Chromium runs ON THE ATTACK BOX, not here, so this
      # value is addressed the way THAT box reaches the proxy. Empty (the
      # default) means the browser egresses directly from the attack box; point
      # it at Burp (`http://kali:8080`) to intercept instead.
      MAGNITUDE_PROXY_URL: "${MAGNITUDE_PROXY_URL:-}"
      # The backend launches that browser over SSH and drives it over CDP
      # through a loopback-only tunnel, so nothing new is published on any
      # network. The profile lives on /kali-data, which both containers mount,
      # so Burp's CA can be installed into it from here.
      BROWSER_AGENT_REMOTE: "${BROWSER_AGENT_REMOTE:-true}"
      BROWSER_AGENT_CDP_PORT: "${BROWSER_AGENT_CDP_PORT:-9222}"
      BROWSER_AGENT_PROFILE_DIR: "${BROWSER_AGENT_PROFILE_DIR:-/kali-data/chromium-home}"
      # The operator's view of the attack box's desktop. The backend bridges the
      # box's Xvnc to this port: the browser the operator watches runs on that
      # box, and this is the stable address the "Browser Agent" panel and the
      # Desktop tab open. See backend/entrypoint.sh.
      BROWSER_AGENT_DESKTOP_PORT: "${BROWSER_AGENT_DESKTOP_PORT:-9021}"
      BROWSER_AGENT_DESKTOP_TARGET: "${BROWSER_AGENT_DESKTOP_TARGET:-kali:5989}"
      # The kali image starts Burp and its gRPC bridge on :50051; without a
      # host every burp_* tool reports "not configured".
      BURP_RPC_HOST: "${BURP_RPC_HOST:-kali}"
    ports:
      # The ATTACK BOX's desktop, bridged by the backend (see backend/entrypoint.sh).
      # This is the port the operator's browser and the "Browser Agent" panel
      # open — what BROWSER_AGENT_DESKTOP_PORT above points at — and it stays
      # stable regardless of how the box itself is networked. (The backend's own
      # Xvfb display on 6080 comes from the base file.)
      - "127.0.0.1:9021:9021"
    volumes:
      # Shared with the attack box: workspaces, reports/screenshots, the Burp CA
      # and the Chromium profile all live here.
      - ./kali-data:/kali-data
    depends_on:
      kali:
        condition: service_healthy

  kali:
    container_name: vulnpen-kali
    build: ./kali
    image: vulnpen-kali-fixed:latest
    # `privileged: true` also hands over the host's devices and lets the box
    # rewrite its own routing. The capabilities the tooling actually needs are
    # named instead.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE  # sshd listens on :22, a privileged port
      - NET_ADMIN   # OpenVPN, raw-socket tooling
      - NET_RAW     # nmap -sS, masscan
      # `cap_drop: ALL` on its own leaves a box that cannot be reached or
      # logged into at all — the entrypoint runs under `set -e`, so it does not
      # degrade, it restart-loops. Each of these was measured against the image
      # with the others absent:
      #
      #   CHOWN       `chpasswd` rewrites /etc/shadow through a temp file and
      #               hands it to the `shadow` group, which is not root's own.
      #               Without it: "Authentication token manipulation error",
      #               and the container exits before sshd ever starts.
      #   SYS_CHROOT  sshd's privilege-separation child chroots into /run/sshd.
      #               Without it every connection dies right after the TCP
      #               handshake ("Connection lost before handshake" / ECONNRESET
      #               from the backend), which reads as an unreachable box.
      #   SETGID      the same child drops to the `sshd` privsep user; setgroups
      #   SETUID      fails with EPERM and the child exits 255.
      #
      # These are the capabilities OpenSSH and shadow-utils require to work at
      # all, not privileges the box's tooling needs: NET_ADMIN/NET_RAW above are
      # still the only ones granted for what the agent runs.
      - CHOWN
      - SYS_CHROOT
      - SETGID
      - SETUID
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      # `default` carries the box's own route to the internet; `control` is the
      # internal network it shares with the backend.
      - default
      - control
    # Loopback-only operator access to the box itself. The backend reaches the
    # box by service name over `control` (SSH 22, Xvnc 5989), so none of the
    # box's own service ports need publishing — and two that used to be are gone:
    #
    #   :9020  the box's own websockify/noVNC. The operator's panel and Desktop
    #          tab open the *backend's* bridge on 9021, never this; nothing on
    #          the host ever listened on 9020, and the panel embedding
    #          localhost:9020 was the "blank frame" bug (see browser-view.service.ts).
    #   :1194/udp  an OpenVPN *server* listener. The box is a VPN client; nothing
    #          in the image ever binds this port.
    #
    # These two are the operator-facing ones and stay:
    ports:
      - "127.0.0.1:4242:22"   # ssh into the attack box by hand
      - "127.0.0.1:4200:4200" # shellinabox — the browser shell run.sh advertises
    volumes:
      - ./kali-data:/kali-data
      - ./backend/.env:/run/vulnpen.env:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/22'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

networks:
  # `internal`: Docker gives it no gateway, so a container on it cannot reach
  # anything except the other containers on it. The backend and the attack box
  # share it for management traffic.
  control:
    internal: true
