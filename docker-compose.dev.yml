services:
  mongodb:
    container_name: vulnpen-mongodb
    image: mongo:7
    volumes:
      - mongodb-data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: always

  redis:
    container_name: vulnpen-redis
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: always

  kali:
    container_name: vulnpen-kali
    build:
      context: ./kali
    image: vulnpen-kali-fixed:latest
    privileged: true
    ports:
      - "127.0.0.1:4242:22"
      - "127.0.0.1:4200:4200"
      - "127.0.0.1:9020:9020"
      - "127.0.0.1:1194:1194/udp"
    volumes:
      - ./kali-data:/kali-data
      - ./backend/.env:/run/vulnpen.env:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/22'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    container_name: vulnpen-backend
    build: ./backend
    cap_add:
      - NET_ADMIN
    environment:
      MONGO_URI: mongodb://mongodb:27017/vulnpen
      REDIS_URL: redis://redis:6379
      CODEX_HOME: /root/.codex
      SSH_CONFIG_FILE: /root/.ssh/config
      WORKSPACE_DIR: /kali-data/workspaces
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1,mongodb,redis,kali,collabora,host.docker.internal}"
      # backend/.env carries the host-facing addresses (localhost:<published
      # port>); inside the compose network the kali service is reached by name.
      SSH_HOST: kali
      SSH_PORT: "22"
      VNC_HOST: kali
      # Report editor (WOPI/Collabora): COLLABORA_URL is server-side discovery
      # (container network), COLLABORA_PUBLIC_URL is the browser iframe address,
      # WOPI_PUBLIC_BASE is how Collabora calls back into the backend.
      COLLABORA_URL: http://collabora:9980
      COLLABORA_PUBLIC_URL: http://localhost:9980
      WOPI_PUBLIC_BASE: http://host.docker.internal:8080/api/wopi/files
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:6080:6080"
    volumes:
      - ./kali-data:/kali-data
      - backend-data:/srv/data
      - ./backend/.env:/srv/data/.env
      - ./backend/model-registry.json:/srv/data/model-registry.json
      - ./config.toml:/srv/data/config.toml:ro
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      kali:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/healthcheck').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  # LibreOffice in the browser — the report is opened/edited here like Word.
  # The backend (host dev mode) is reachable via host.docker.internal; point
  # COLLABORA_URL / WOPI_PUBLIC_BASE on the backend elsewhere to change that.
  collabora:
    container_name: vulnpen-collabora
    image: collabora/code:latest
    environment:
      - aliasgroup1=http://host.docker.internal:8080.*
      - username=admin
      - password=${COLLABORA_PASSWORD:-vulnpen-admin}
      # Every report opens at a literal 100%. Collabora's smart zoom instead
      # fits the page to the frame width, and Writer's zoom scale tops out at
      # 170%, so on a wide window the report always opened over-zoomed at that
      # ceiling and changed size with the window.
      - extra_params=--o:ssl.enable=false --o:ssl.termination=false --o:net.post_allow.host[0]=.+ --o:frame_ancestors=localhost:3000 --o:user_interface.smart_zoom=false --o:user_interface.default_zoom=100
    cap_add:
      - MKNOD
    ports:
      - "127.0.0.1:9980:9980"
    restart: unless-stopped

  # The Next.js UI, built into the stack so the whole app runs from Docker.
  # NEXT_PUBLIC_BACKEND_URI is inlined into the client bundle and used by the
  # browser, so it points at the host-published backend port, not the service
  # name — the same address the host dev server used.
  frontend:
    container_name: vulnpen-frontend
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_URI: ${NEXT_PUBLIC_BACKEND_URI:-http://localhost:8080}
        NEXT_PUBLIC_DEPLOYMENT: ${NEXT_PUBLIC_DEPLOYMENT:-LOCAL}
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ./frontend/.env
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongodb-data:
    driver: local
  redis-data:
    driver: local
  backend-data:
    driver: local
